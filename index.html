<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Relocation Dashboard 🏔️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f1e;
  --surface: rgba(255,255,255,0.06);
  --surface-hover: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.18);
  --text: #f1f5f9;
  --muted: #94a3b8;
  --primary: #38bdf8;
  --accent: #34d399;
  --good: #22c55e;
  --ok: #eab308;
  --poor: #f87171;
  --gold: #f59e0b;
  --r: 16px;
  --rs: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(160deg,#0d1b2a 0%,#1a3a5c 50%,#1e4d3b 100%);
  padding:2rem 1.25rem 2.5rem;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.header::after{
  content:'⛰️';font-size:9rem;opacity:.04;
  position:absolute;bottom:-1.5rem;right:-1rem;line-height:1;
}
.header-flags{font-size:1.75rem;margin-bottom:.5rem;letter-spacing:.25rem;}
.header h1{
  font-size:1.55rem;font-weight:800;
  background:linear-gradient(135deg,#38bdf8,#34d399);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:.3rem;
}
.header-sub{color:var(--muted);font-size:.85rem;line-height:1.6;}
.header-badge{
  display:inline-flex;align-items:center;gap:.35rem;
  margin-top:.75rem;padding:.3rem .75rem;
  background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);
  border-radius:20px;color:var(--primary);font-size:.75rem;font-weight:600;
}

/* ── STICKY CONTROLS ── */
.controls{
  position:sticky;top:0;z-index:50;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:.75rem 1rem .5rem;
}
.weights-toggle{
  width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:.65rem 1rem;border-radius:var(--rs);
  font-size:.82rem;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.6rem;transition:background .2s;
}
.weights-toggle:hover{background:var(--surface-hover);}
.weights-panel{
  display:none;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:var(--r);padding:.9rem;margin-bottom:.6rem;
}
.weights-panel.open{display:block;}
.weight-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem;}
.weight-emoji{font-size:.95rem;width:22px;text-align:center;flex-shrink:0;}
.weight-lbl{font-size:.72rem;color:var(--muted);width:88px;flex-shrink:0;}
.weight-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:4px;border-radius:2px;background:var(--border);outline:none;
}
.weight-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--primary);cursor:pointer;border:2px solid var(--bg);
}
.weight-val{font-size:.72rem;font-weight:700;color:var(--primary);width:16px;text-align:right;}
.reset-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:.35rem .75rem;border-radius:20px;font-size:.72rem;cursor:pointer;
  margin-top:.35rem;
}
.reset-btn:hover{border-color:var(--border-strong);color:var(--text);}

.filter-bar{
  display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;
  padding-bottom:.5rem;align-items:center;
}
.filter-bar::-webkit-scrollbar{display:none;}
.pill{
  padding:.35rem .8rem;border-radius:20px;font-size:.78rem;font-weight:500;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.pill.active{background:var(--primary);color:#0a0f1e;border-color:var(--primary);}
.sort-sel{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:.35rem .5rem;border-radius:20px;font-size:.78rem;outline:none;
  cursor:pointer;margin-left:auto;flex-shrink:0;
}

/* ── MAIN ── */
main{padding:.9rem 1rem 4rem;}
.results-note{
  font-size:.72rem;color:var(--muted);
  text-align:center;margin-bottom:.75rem;
}
.cards-grid{
  display:grid;grid-template-columns:1fr;gap:.9rem;
}
@media(min-width:580px){.cards-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:880px){.cards-grid{grid-template-columns:repeat(3,1fr);}}

/* ── CARD ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:1.1rem;cursor:pointer;
  transition:transform .2s,background .2s,border-color .2s;
  position:relative;
}
.card:hover{background:var(--surface-hover);transform:translateY(-2px);}
.card.fav{border-color:var(--gold);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.8rem;}
.card-meta{flex:1;min-width:0;}
.card-name-row{display:flex;align-items:center;gap:.45rem;margin-bottom:.15rem;}
.card-flag{font-size:1.1rem;}
.card-name{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-region{font-size:.7rem;color:var(--muted);}

/* Score ring */
.ring-wrap{position:relative;width:52px;height:52px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4.5;}
.ring-fg{fill:none;stroke-width:4.5;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.ring-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:700;
}

/* Commute badge */
.commute-pill{
  display:inline-flex;align-items:center;gap:.3rem;
  background:rgba(56,189,248,.12);color:var(--primary);
  padding:.22rem .6rem;border-radius:20px;font-size:.72rem;font-weight:600;
  margin-bottom:.8rem;
}

/* Criteria bars */
.bars{display:flex;flex-direction:column;gap:.38rem;margin-bottom:.8rem;}
.bar-row{display:flex;align-items:center;gap:.45rem;}
.bar-lbl{font-size:.67rem;color:var(--muted);width:68px;flex-shrink:0;white-space:nowrap;overflow:hidden;}
.bar-track{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-num{font-size:.64rem;color:var(--muted);width:12px;text-align:right;}

/* Tags */
.card-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem;}
.tag{
  font-size:.67rem;padding:.18rem .5rem;border-radius:8px;font-weight:500;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tag-pro{background:rgba(34,197,94,.15);color:#4ade80;}
.tag-con{background:rgba(248,113,113,.15);color:#fca5a5;}

/* Card actions */
.card-actions{display:flex;gap:.45rem;}
.btn-detail{
  flex:1;background:rgba(56,189,248,.12);color:var(--primary);
  border:1px solid rgba(56,189,248,.25);padding:.55rem;
  border-radius:var(--rs);font-size:.78rem;font-weight:600;cursor:pointer;
  transition:background .2s;
}
.btn-detail:hover{background:rgba(56,189,248,.22);}
.btn-fav{
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);padding:.55rem .7rem;border-radius:var(--rs);
  font-size:.95rem;cursor:pointer;transition:all .2s;line-height:1;
}
.btn-fav.on{background:rgba(245,158,11,.12);border-color:var(--gold);color:var(--gold);}

/* ── MODAL ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);z-index:100;
  align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex;}
.sheet{
  background:#101929;border-radius:22px 22px 0 0;
  width:100%;max-width:680px;max-height:92vh;
  display:flex;flex-direction:column;
  animation:up .3s ease;
}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:38px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:1rem auto .75rem;}
.sheet-scroll{overflow-y:auto;flex:1;padding:0 1.25rem 2rem;}
.sheet-scroll::-webkit-scrollbar{width:3px;}
.sheet-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px;}

.modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.9rem;}
.modal-title{font-size:1.4rem;font-weight:800;}
.modal-sub{font-size:.75rem;color:var(--muted);margin-top:.15rem;}
.btn-close{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);width:34px;height:34px;border-radius:50%;
  font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* Modal tabs */
.modal-tabs{
  display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;
  margin-bottom:1rem;padding-bottom:.1rem;
}
.modal-tabs::-webkit-scrollbar{display:none;}
.mtab{
  padding:.4rem .8rem;border-radius:20px;font-size:.78rem;font-weight:500;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.mtab.active{background:var(--primary);color:#0a0f1e;border-color:var(--primary);}

/* Tab panes */
.pane{display:none;}
.pane.active{display:block;}

/* Modal score section */
.score-row{
  display:flex;align-items:center;gap:1rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rs);padding:1rem;margin-bottom:1rem;
}
.score-ring-lg{position:relative;width:80px;height:80px;flex-shrink:0;}
.score-ring-lg svg{transform:rotate(-90deg);}
.score-num-lg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:800;
}
.score-meta{flex:1;}
.score-meta p{font-size:.8rem;color:var(--muted);margin-top:.2rem;}

/* Highlight callout */
.callout{
  padding:.8rem .9rem;background:rgba(56,189,248,.07);
  border-left:3px solid var(--primary);border-radius:0 var(--rs) var(--rs) 0;
  font-size:.83rem;line-height:1.6;color:#cbd5e1;margin-bottom:1rem;
}

/* Section titles */
.stitle{
  font-size:.72rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;
  margin:1rem 0 .5rem;
}

/* Full criteria bars */
.full-bars{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem;}
.fbar-row{display:flex;align-items:center;gap:.75rem;}
.fbar-lbl{font-size:.78rem;color:var(--muted);width:108px;flex-shrink:0;}
.fbar-track{flex:1;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
.fbar-fill{height:100%;border-radius:4px;}
.fbar-num{font-size:.78rem;font-weight:600;width:28px;text-align:right;}

/* Pros / cons */
.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem;}
.pc-box{background:var(--surface);border-radius:var(--rs);padding:.75rem;}
.pc-box h4{font-size:.72rem;font-weight:600;margin-bottom:.5rem;}
.pc-box h4.g{color:var(--good);}
.pc-box h4.r{color:var(--poor);}
.pc-box li{
  font-size:.72rem;line-height:1.55;color:#cbd5e1;
  list-style:none;padding-left:.9rem;position:relative;margin-bottom:.2rem;
}
.pc-box li::before{position:absolute;left:0;}
.pc-box.pros li::before{content:'✓';color:var(--good);}
.pc-box.cons li::before{content:'✗';color:var(--poor);}

/* Info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem;}
.info-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rs);padding:.75rem;text-align:center;
}
.info-val{font-size:1.1rem;font-weight:700;margin-bottom:.15rem;}
.info-lbl{font-size:.68rem;color:var(--muted);}

/* Company list */
.co-list{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0 1rem;}
.co-item{
  background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.15);
  border-radius:var(--rs);padding:.65rem .8rem;
}
.co-name{font-size:.82rem;font-weight:700;color:var(--primary);margin-bottom:.25rem;}
.co-what{font-size:.75rem;line-height:1.55;color:#cbd5e1;}
.co-none{font-size:.8rem;color:var(--muted);font-style:italic;margin:.5rem 0 1rem;}

/* Tip box */
.tip{
  background:var(--surface);border-radius:var(--rs);padding:.8rem;margin-top:.75rem;
}
.tip-lbl{font-size:.68rem;color:var(--muted);font-weight:600;margin-bottom:.4rem;}
.tip p{font-size:.78rem;color:#cbd5e1;line-height:1.6;}

/* Map link */
.map-link{
  display:block;background:rgba(52,211,153,.1);color:var(--accent);
  border:1px solid rgba(52,211,153,.25);padding:.7rem;
  border-radius:var(--rs);text-align:center;text-decoration:none;
  font-size:.82rem;font-weight:600;margin-top:1rem;
}

/* Notes textarea */
.notes-ta{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:.75rem;
  font-size:.82rem;font-family:inherit;resize:none;min-height:100px;
  outline:none;transition:border-color .2s;
}
.notes-ta:focus{border-color:var(--primary);}
.notes-ta::placeholder{color:var(--muted);}

/* Score colour helpers */
.c-good{color:var(--good);}
.c-ok{color:var(--ok);}
.c-poor{color:var(--poor);}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="header">
  <div class="header-flags">🇮🇪 ✈️ 🏔️</div>
  <h1>Our Relocation Dashboard</h1>
  <p class="header-sub">Ireland → Bavaria &amp; Austria<br>Finding the perfect home together</p>
  <span class="header-badge">🚂 ADI Munich Office · 3 days/week · max 2 hours</span>
</header>

<!-- ═══ CONTROLS ═══ -->
<div class="controls">
  <button class="weights-toggle" id="wt-btn">
    <span>⚙️&nbsp; Adjust Priorities</span>
    <span id="wt-arrow">▼</span>
  </button>
  <div class="weights-panel" id="wt-panel"></div>

  <div class="filter-bar">
    <button class="pill active" data-filter="all">All</button>
    <button class="pill" data-filter="DE">🇩🇪 Germany</button>
    <button class="pill" data-filter="AT">🇦🇹 Austria</button>
    <button class="pill" data-filter="fav">⭐ Favourites</button>
    <select class="sort-sel" id="sort-sel">
      <option value="score">Best Match</option>
      <option value="commute">Shortest Commute</option>
      <option value="cost">Cheapest First</option>
      <option value="alps">Best Alps Access</option>
      <option value="lakes">Best Lakes</option>
      <option value="name">A–Z</option>
    </select>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<main>
  <div class="results-note" id="rn"></div>
  <div class="cards-grid" id="grid"></div>
</main>

<!-- ═══ MODAL ═══ -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-scroll" id="sheet-scroll">
      <div class="modal-hdr">
        <div>
          <div class="modal-title" id="m-title"></div>
          <div class="modal-sub" id="m-sub"></div>
        </div>
        <button class="btn-close" id="btn-close">✕</button>
      </div>
      <div class="modal-tabs" id="m-tabs">
        <button class="mtab active" data-tab="overview">Overview</button>
        <button class="mtab" data-tab="jobs">💼 Jobs</button>
        <button class="mtab" data-tab="dog">🐾 Dog</button>
        <button class="mtab" data-tab="housing">🏠 Housing</button>
        <button class="mtab" data-tab="transport">🚂 Transport</button>
        <button class="mtab" data-tab="notes">📝 Notes</button>
      </div>
      <div id="m-body"></div>
    </div>
  </div>
</div>

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function scoreColor(s) {
  return s >= 7 ? 'var(--good)' : s >= 5 ? 'var(--ok)' : 'var(--poor)';
}
function scoreClass(s) {
  return s >= 7 ? 'c-good' : s >= 5 ? 'c-ok' : 'c-poor';
}
function weighted(loc) {
  let t = 0, m = 0;
  CRITERIA.forEach(c => {
    const w = W[c.key] || 0;
    t += loc.sc[c.key] * w;
    m += 10 * w;
  });
  return m > 0 ? Math.round(t / m * 100) : 0;
}
function ring(score100, size, strokeW) {
  const r = (size - strokeW) / 2;
  const circ = 2 * Math.PI * r;
  const off = circ - (score100 / 100) * circ;
  const cx = size / 2, cy = size / 2;
  const col = scoreColor(score100 / 10);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${strokeW}" cx="${cx}" cy="${cy}" r="${r}"/>
    <circle fill="none" stroke="${col}" stroke-width="${strokeW}" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}" cx="${cx}" cy="${cy}" r="${r}"/>
  </svg>`;
}

/* ══════════════════════════════════════════
   WEIGHTS PANEL
══════════════════════════════════════════ */
function buildWeightsPanel() {
  const panel = document.getElementById('wt-panel');
  panel.innerHTML = CRITERIA.map(c => `
    <div class="weight-row">
      <span class="weight-emoji">${c.emoji}</span>
      <span class="weight-lbl">${c.label}</span>
      <input type="range" class="weight-slider" min="0" max="5" value="${W[c.key]}"
        data-key="${c.key}" id="ws-${c.key}">
      <span class="weight-val" id="wv-${c.key}">${W[c.key]}</span>
    </div>
  `).join('') + `<button class="reset-btn" id="reset-w">↺ Reset weights</button>`;

  panel.querySelectorAll('.weight-slider').forEach(sl => {
    sl.addEventListener('input', e => {
      const key = e.target.dataset.key;
      W[key] = +e.target.value;
      document.getElementById('wv-' + key).textContent = e.target.value;
      renderCards();
      if (activeLoc) refreshModalScore();
    });
  });
  document.getElementById('reset-w').addEventListener('click', () => {
    CRITERIA.forEach(c => {
      W[c.key] = 3;
      document.getElementById('ws-' + c.key).value = 3;
      document.getElementById('wv-' + c.key).textContent = 3;
    });
    renderCards();
    if (activeLoc) refreshModalScore();
  });
}

document.getElementById('wt-btn').addEventListener('click', () => {
  const panel = document.getElementById('wt-panel');
  const arrow = document.getElementById('wt-arrow');
  const open = panel.classList.toggle('open');
  arrow.textContent = open ? '▲' : '▼';
});

/* ══════════════════════════════════════════
   FILTER / SORT
══════════════════════════════════════════ */
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    filter = p.dataset.filter;
    renderCards();
  });
});
document.getElementById('sort-sel').addEventListener('change', e => {
  sortBy = e.target.value;
  renderCards();
});

function getList() {
  let list = LOCS.map(l => ({...l, _s: weighted(l)}));
  if (filter === 'DE')  list = list.filter(l => l.country === 'DE');
  if (filter === 'AT')  list = list.filter(l => l.country === 'AT');
  if (filter === 'fav') list = list.filter(l => favs.includes(l.id));
  list.sort((a, b) => {
    if (sortBy === 'commute') return a.commuteMin - b.commuteMin;
    if (sortBy === 'cost')    return b.sc.cost - a.sc.cost;
    if (sortBy === 'alps')    return b.sc.alps - a.sc.alps;
    if (sortBy === 'lakes')   return b.sc.lakes - a.sc.lakes;
    if (sortBy === 'name')    return a.name.localeCompare(b.name);
    return b._s - a._s;
  });
  return list;
}

/* ══════════════════════════════════════════
   RENDER CARDS
══════════════════════════════════════════ */
function renderCards() {
  const list = getList();
  document.getElementById('rn').textContent =
    `${list.length} location${list.length !== 1 ? 's' : ''} — tap a card to explore details`;
  document.getElementById('grid').innerHTML = list.map(renderCard).join('');

  // attach events
  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    card.addEventListener('click', e => {
      if (e.target.closest('.btn-fav')) return;
      openModal(id);
    });
  });
  document.querySelectorAll('.btn-fav').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(btn.dataset.id);
    });
  });
  document.querySelectorAll('.btn-detail').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openModal(btn.dataset.id);
    });
  });
}

function renderCard(loc) {
  const s = loc._s;
  const isFav = favs.includes(loc.id);
  const col = scoreColor(s / 10);
  const pros2 = loc.pros.slice(0, 2);
  const con1 = loc.cons.slice(0, 1);

  return `
  <div class="card${isFav ? ' fav' : ''}" data-id="${loc.id}">
    <div class="card-top">
      <div class="card-meta">
        <div class="card-name-row">
          <span class="card-flag">${loc.flag}</span>
          <span class="card-name">${loc.name}</span>
        </div>
        <div class="card-region">${loc.region}</div>
      </div>
      <div class="ring-wrap">
        ${ring(s, 52, 4.5)}
        <div class="ring-num ${scoreClass(s/10)}">${s}</div>
      </div>
    </div>

    <div class="commute-pill">🚂 ${loc.commuteText}</div>

    <div class="bars">
      ${CRITERIA.map(c => `
        <div class="bar-row">
          <div class="bar-lbl">${c.emoji} ${c.label.split(' ')[0]}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${loc.sc[c.key]*10}%;background:${scoreColor(loc.sc[c.key])}"></div></div>
          <div class="bar-num">${loc.sc[c.key]}</div>
        </div>
      `).join('')}
    </div>

    <div class="card-tags">
      ${pros2.map(p => `<span class="tag tag-pro">${p.length > 32 ? p.slice(0,31)+'…' : p}</span>`).join('')}
      ${con1.map(c => `<span class="tag tag-con">${c.length > 32 ? c.slice(0,31)+'…' : c}</span>`).join('')}
    </div>

    <div class="card-actions">
      <button class="btn-detail" data-id="${loc.id}">See Details</button>
      <button class="btn-fav${isFav ? ' on' : ''}" data-id="${loc.id}" title="Favourite">${isFav ? '⭐' : '☆'}</button>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════
   FAVOURITES
══════════════════════════════════════════ */
function toggleFav(id) {
  favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
  localStorage.setItem('rd-favs', JSON.stringify(favs));
  renderCards();
}

  document.getElementById('m-title').textContent = `${loc.flag} ${loc.name}`;
  document.getElementById('m-sub').textContent = `${loc.region} · Pop. ${loc.pop}`;
  renderModalBody(loc);
  setTab('overview');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('sheet-scroll').scrollTop = 0;
}

function closeModal() {
  saveNotes();
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  activeLoc = null;
}

  if (e.target === document.getElementById('overlay')) closeModal();
});
document.getElementById('btn-close').addEventListener('click', closeModal);

document.getElementById('m-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.mtab');
  if (btn) setTab(btn.dataset.tab, btn);
});

function setTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.mtab').forEach(t => t.classList.remove('active'));
  const target = btn || document.querySelector(`.mtab[data-tab="${tab}"]`);
  if (target) target.classList.add('active');
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  const pane = document.getElementById('pane-' + tab);
  if (pane) pane.classList.add('active');
}

  if (!activeLoc) return;
  const s = weighted(activeLoc);

    el.textContent = `${s}/100`;
    el.className = 'score-num-lg ' + scoreClass(s / 10);
  }
  const ringEl = document.getElementById('modal-score-ring');
  if (ringEl) ringEl.innerHTML = ring(s, 80, 6);

        <div class="info-lbl">Cost of Living</div>
      </div>
      <div class="info-card">
        <div class="info-val">${loc.pop}</div>
        <div class="info-lbl">Population</div>
      </div>
    </div>

    <div class="stitle">Housing Market</div>
    <p style="font-size:.83rem;line-height:1.65;color:#cbd5e1">${loc.housingNotes}</p>

    <div class="tip" style="margin-top:1rem">
      <div class="tip-lbl">🏡 FINDING YOUR ENCLOSED GARDEN / GROUND FLOOR</div>
      <p>On <strong>Immobilienscout24.de</strong> filter for: "Erdgeschoss" (ground floor), "Garten" (garden), "Terrasse mit Garten". For houses: "Einfamilienhaus mieten" or "Doppelhaus mieten". In Austria use <strong>willhaben.at</strong>. Facebook groups "Wohnung ${loc.nameDe}" are often faster than portals. Expat WhatsApp networks can surface unlisted properties. Consider a short-term stay first (Airbnb or furnished) to find the right neighbourhood before committing.</p>
    </div>
  </div>

  <!-- TRANSPORT -->
  <div class="pane" id="pane-transport">
    <div class="info-grid">
      <div class="info-card">
        <div class="info-val" style="color:var(--primary)">${loc.commuteMin === 0 ? 'On-site' : loc.commuteMin + ' min'}</div>
        <div class="info-lbl">Train to ADI Munich</div>
      </div>
      <div class="info-card">
        <div class="info-val ${scoreClass(loc.sc.rail)}">${loc.sc.rail}/10</div>
        <div class="info-lbl">Rail Network Score</div>
      </div>
    </div>

    <div class="stitle">Transport Details</div>
    <p style="font-size:.83rem;line-height:1.65;color:#cbd5e1">${loc.transportNotes}</p>

    <div class="tip" style="margin-top:1rem">
      <div class="tip-lbl">🚂 COMMUTE REALITY CHECK (3 DAYS/WEEK)</div>
      <p>${loc.commuteMin === 0
        ? 'Zero commute — walk, cycle, or short tram ride to the ADI Munich office. Maximum flexibility.'
        : `${loc.commuteMin} min each way = ${(loc.commuteMin * 2 / 60).toFixed(1)} hours per commute day. For 3 days/week: ~${(loc.commuteMin * 6 / 60).toFixed(1)} hours/week commuting. The <strong>Deutschlandticket</strong> (€58/month) covers all regional trains in Germany — excellent value. Austrian residents can use the <strong>KlimaTicket Österreich</strong> (~€91/month) for unlimited ÖBB travel.`
      }</p>
    </div>

    <div class="tip" style="margin-top:.75rem">
      <div class="tip-lbl">✈️ FLIGHTS HOME TO IRELAND</div>
      <p>Munich Airport (MUC) is the main hub — Ryanair and Aer Lingus fly to Dublin and Cork. Munich–Dublin ~2h 30min. ${loc.country === 'AT' ? 'From Austrian locations, Salzburg Airport also has seasonal Ryanair routes to Dublin. Innsbruck Airport has some UK/Irish connections. Checking both MUC and SZG for best fares is worthwhile.' : 'From most Bavarian locations, MUC is straightforward. The S1 S-Bahn connects Munich city to the airport directly.'}</p>
    </div>
  </div>

  <!-- NOTES -->
  <div class="pane" id="pane-notes">
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:.75rem">Your notes about ${loc.name}. Saved on this device automatically.</p>
    <textarea class="notes-ta" id="notes-ta-${loc.id}" placeholder="Add your thoughts, questions, things to check... e.g. 'Found a great cooperative care vet here' or 'Rent seems high right now — check again in 3 months'">${savedNotes}</textarea>

    <div class="tip" style="margin-top:1rem">
      <div class="tip-lbl">📋 THINGS TO RESEARCH FOR ${loc.name.toUpperCase()}</div>
      <p style="line-height:2">
        ☐ Cooperative care / Fear Free vets in ${loc.nameDe}<br>
        ☐ Specialist groomer (angstfreies Grooming)<br>
        ☐ Dog boarding kennels near ${loc.nameDe}<br>
        ☐ Expat Facebook/WhatsApp groups<br>
        ☐ Immobilienscout24: Erdgeschoss + Garten listings<br>
        ☐ Medical device companies hiring QA/microbiology<br>
        ☐ Actual train timetable from your target neighbourhood<br>
        ☐ Local Hundeverein (dog club) for socialisation<br>
        ☐ Enclosed dog parks ("eingezäunter Hundepark")
      </p>
    </div>
  </div>
  `;
}

function saveNotes() {
  if (!activeLoc) return;
  const ta = document.getElementById('notes-ta-' + activeLoc.id);
  if (ta) {
    notes[activeLoc.id] = ta.value;
    localStorage.setItem('rd-notes', JSON.stringify(notes));
  }
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
buildWeightsPanel();
renderCards();
</script>
</body>
</html>
